name: build

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: npm ci
      - run: npm run ci
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  package-windows:
    needs: validate
    runs-on: windows-latest
    env:
      # Public app identity embedded in the binary, not a secret or verification badge.
      DEVELOPER_USAGE_INSIGHTS_CLIENT_ID: ${{ vars.DEVELOPER_USAGE_INSIGHTS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require publisher browser sign-in configuration
        shell: pwsh
        run: |
          $clientId = [guid]::Empty
          if (-not [guid]::TryParse($env:DEVELOPER_USAGE_INSIGHTS_CLIENT_ID, [ref]$clientId) -or $clientId -eq [guid]::Empty) {
            throw 'Set the repository variable DEVELOPER_USAGE_INSIGHTS_CLIENT_ID to the publisher Entra public-client application ID before packaging a release.'
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: npm ci
      - name: Build Windows executable
        run: npm run build:exe
      - name: Test private GitHub CLI extraction
        working-directory: api
        run: npx vitest run tests/unit/github-cli-binary.test.ts tests/unit/azure-cli-binary.test.ts
      - name: Smoke test executable
        run: npm run test:exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: developer-usage-insights-windows-unsigned
          path: release/
          retention-days: 30

  package-posix:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_USAGE_INSIGHTS_CLIENT_ID: ${{ vars.DEVELOPER_USAGE_INSIGHTS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: npm ci
      - name: Build native executable
        run: npm run build:exe
      - name: Package Unix release
        run: npm run package:posix
      - name: Smoke test executable
        run: npm run test:exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: developer-usage-insights-${{ matrix.os }}
          path: release/
          retention-days: 30
