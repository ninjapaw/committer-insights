name: build

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: npm ci
      - run: npm run ci
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  package-windows:
    needs: validate
    runs-on: windows-latest
    env:
      COMMITTER_INSIGHTS_CLIENT_ID: ${{ vars.COMMITTER_INSIGHTS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Require publisher browser sign-in configuration
        shell: pwsh
        run: |
          $clientId = [guid]::Empty
          if (-not [guid]::TryParse($env:COMMITTER_INSIGHTS_CLIENT_ID, [ref]$clientId) -or $clientId -eq [guid]::Empty) {
            throw 'Set the repository variable COMMITTER_INSIGHTS_CLIENT_ID to the publisher Entra public-client application ID before packaging a release.'
          }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: npm ci
      - name: Build Windows executable
        run: npm run build:exe
      - name: Smoke test executable
        run: npm run test:exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: committer-insights-windows-unsigned
          path: release/
          retention-days: 30
