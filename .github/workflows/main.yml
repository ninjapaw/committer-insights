name: build

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: npm ci
      - run: npm run ci
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 90

  package-windows:
    needs: validate
    runs-on: windows-latest
    env:
      # Public app identity embedded in the binary, not a secret or verification badge.
      DEVELOPER_USAGE_INSIGHTS_CLIENT_ID: ${{ vars.DEVELOPER_USAGE_INSIGHTS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: npm ci
      - name: Build Windows executable
        run: npm run build:exe
      - name: Test private GitHub CLI extraction
        working-directory: api
        run: npx vitest run tests/unit/github-cli-binary.test.ts tests/unit/azure-cli-binary.test.ts
      - name: Smoke test executable
        if: matrix.os == 'macos-latest'
        run: npm run test:macos
      - name: Smoke test executable
        if: matrix.os != 'macos-latest'
        run: npm run test:exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-usage-insights-windows-unsigned
          path: release/
          retention-days: 30

  package-posix:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_USAGE_INSIGHTS_CLIENT_ID: ${{ vars.DEVELOPER_USAGE_INSIGHTS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: 'npm'
      - run: npm ci
      - name: Build native executable
        run: npm run build:exe
      - name: Package Unix release
        run: npm run package:posix
      - name: Smoke test executable
        if: matrix.os == 'macos-latest'
        run: npm run test:macos
      - name: Smoke test executable
        if: matrix.os != 'macos-latest'
        run: npm run test:exe
      - name: Upload Linux release bundle
        if: matrix.os != 'macos-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-usage-insights-${{ matrix.os }}
          path: release/
          retention-days: 30
      - name: Upload macOS DMG
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: developer-usage-insights-macos-dmg
          path: release/developer-usage-insights-darwin-arm64.dmg
          retention-days: 30
